version: v1.0

workflows:
  example-workflow:
    type: cwl
    config:
      file: cwl/task_hostname.cwl
      settings: cwl/settings.yml
    bindings:
      - step: /
        target:
          deployment: slurm
          service: milan-deep

deployments:
  ssh-genoa:
    type: ssh
    config:
      nodes:
        - genoa-login.h-its.org
      username: doserbd
      checkHostKey: false
  slurm:
    type: slurm
    workdir: /hits/basement/its/doserbd/streamflow
    config:
      maxConcurrentJobs: 10
      services:
        milan-deep:
          file: environments/work.sh
          partition: milan-deep.p
          time: 00:10:00
          mem: 1gb
          mailUser: bernd.doser@h-its.org
          mailType: ALL
    wraps: ssh-genoa
